<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      const [item, action] = window.location.pathname.split("/").slice(2);
      const params = new URLSearchParams(window.location.search);
      let status = "ok";
      let data = "";
      switch (item) {
        case "threads":
          switch (action) {
            case "callback":
              {
                const code = (params.get("code") || "").replace(/#_/, "");
                if (code) {
                  status = "ok";
                  data = code;
                } else {
                  status = "ng";
                  data = params.get("error") || "";
                }
              }
              break;
            default:
              break;
          }
          break;
        case "twitter":
          switch (action) {
            case "callback":
              status = params.get("state") || "ng";
              data = params.get("code") || "error";
              break;
            default:
              break;
          }
          break;
        default:
          break;
      }
      window.location.replace(`/#/auth/${item}/${action}/${status}/${data}`);
    </script>
  </head>
  <body style="font-family: sans-serif; padding: 1rem">
    Redirecting...
  </body>
</html>
