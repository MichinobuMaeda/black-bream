name: Functions on merge deployment
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/on-call-functions.yml
      - .github/workflows/on-merge-functions.yml
      - "functions/**"
jobs:
  black-bream:
    uses: ./.github/workflows/on-call-functions.yml
    with:
      site-id: black-bream
    secrets:
      firebase_service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLACK_BREAM }}
  grey-bream:
    uses: ./.github/workflows/on-call-functions.yml
    with:
      site-id: grey-bream
    secrets:
      firebase_service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GREY_BREAM }}
