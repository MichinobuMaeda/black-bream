name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"
      - run: npm ci && npm ci --prefix functions
      - run: npm test
      - name: Set firebase api key
        run: |
          sed 's/FIREBASE_API_KEY/${{ secrets.FIREBASE_API_KEY_BLACK_BREAM }}/' \
            -i src/firebaseConfig.js
      - name: Set firebase reCAPTCHA key
        run: |
          sed 's/FIREBASE_RECAPTCHA_KEY/${{ secrets.FIREBASE_RECAPTCHA_KEY_BLACK_BREAM }}/' \
            -i src/firebaseConfig.js
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLACK_BREAM }}
          projectId: black-bream
