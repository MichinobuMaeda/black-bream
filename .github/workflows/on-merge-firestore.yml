name: Firestore on merge deployment
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/on-call-test-firestore.yml
      - .github/workflows/on-call-firestore.yml
      - .github/workflows/on-merge-firestore.yml
      - .github/sites/**/*
      - "firestore.*"
      - test/firestore/**/*
jobs:
  test-firestore-rules:
    uses: ./.github/workflows/on-call-test-firestore.yml
  black-bream:
    needs: [test-firestore-rules]
    uses: ./.github/workflows/on-call-firestore.yml
    with:
      site-id: black-bream
    secrets:
      firebase_service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BLACK_BREAM }}
  grey-bream:
    needs: [test-firestore-rules]
    uses: ./.github/workflows/on-call-firestore.yml
    with:
      site-id: grey-bream
    secrets:
      firebase_service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GREY_BREAM }}
  white-bream:
    needs: [test-firestore-rules]
    uses: ./.github/workflows/on-call-firestore.yml
    with:
      site-id: white-bream
    secrets:
      firebase_service_account: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_WHITE_BREAM }}
